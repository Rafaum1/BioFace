<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BioFace{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navigation.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('main.index') }}">BioFace</a>
    <nav>
      <a href="{{ url_for('main.index') }}" {% if request.endpoint == 'main.index' %}class="active" aria-current="page"{% endif %}>Acessar</a>
      <a href="{{ url_for('main.cadastro') }}" {% if request.endpoint == 'main.cadastro' %}class="active" aria-current="page"{% endif %}>Cadastros</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
